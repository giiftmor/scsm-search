services:
  scsm-search:
    build: .
    image: scsm-search:latest
    container_name: scsm-search
    restart: unless-stopped
    env_file: .env
    ports:
      - "3101:3000"
    networks:
      - ai-stack_ai_net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  ai-stack_ai_net:
    external: true
